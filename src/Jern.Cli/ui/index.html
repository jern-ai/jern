<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jern</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2316181d'/%3E%3Cg stroke='%23c2643a' stroke-width='12' stroke-linecap='square' fill='none'%3E%3Cpolyline points='46,24 83,43 46,62'/%3E%3Cpolyline points='82,104 45,85 82,66'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --ink: #e8e6e1; --dim: #9a9890;
    --rust: #c2643a; --steel: #7fa6bd; --line: #2c303a;
    --green: #7fbd8a; --red: #c96f5e; --yellow: #d9b76a;
    --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; }

  header { display: flex; align-items: center; gap: .7rem; padding: .65rem 1rem;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header svg { flex: none; }
  header .name { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  header .chip { font-family: var(--mono); font-size: .74rem; color: var(--steel);
                 border: 1px solid var(--line); border-radius: 99px; padding: .1rem .6rem; }
  header .meta { color: var(--dim); font-size: .78rem; }
  header .spacer { flex: 1; }
  header button { background: none; border: 1px solid var(--line); color: var(--dim);
                  border-radius: 6px; padding: .25rem .7rem; font-size: .78rem; cursor: pointer; }
  header button:hover { color: var(--ink); border-color: var(--dim); }

  main { flex: 1; overflow-y: auto; padding: 1.2rem; }
  .feed { width: 100%; display: flex; flex-direction: column; gap: .8rem; }

  .msg { border-radius: 10px; padding: .7rem 1rem; white-space: pre-wrap;
         overflow-wrap: break-word; }
  .msg.user { background: var(--panel); border: 1px solid var(--line);
              align-self: flex-end; max-width: 85%; }
  .msg.user::before { content: "you"; display: block; font-family: var(--mono);
                      font-size: .7rem; color: var(--rust); margin-bottom: .25rem; }
  .msg.assistant { align-self: stretch; }
  .msg.assistant::before { content: "jern"; display: block; font-family: var(--mono);
                           font-size: .7rem; color: var(--steel); margin-bottom: .25rem; }
  .msg.assistant.streaming::after { content: "▌"; color: var(--rust); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tool { align-self: flex-start; font-family: var(--mono); font-size: .78rem;
          color: var(--dim); padding: .1rem .2rem; }
  .tool b { color: var(--steel); font-weight: 500; }
  .note { align-self: center; font-size: .78rem; color: var(--dim); }
  .error { align-self: stretch; color: var(--red); font-family: var(--mono);
           font-size: .82rem; white-space: pre-wrap; }

  .approval { align-self: stretch; border: 1px solid var(--yellow); border-radius: 10px;
              background: var(--panel); padding: .8rem 1rem; }
  .approval h4 { color: var(--yellow); font-size: .8rem; font-weight: 600;
                 text-transform: uppercase; letter-spacing: .08em; margin-bottom: .5rem; }
  .approval pre { font-family: var(--mono); font-size: .8rem; white-space: pre-wrap;
                  overflow-wrap: break-word; margin-bottom: .7rem; }
  .approval pre .minus { color: var(--red); }
  .approval pre .plus { color: var(--green); }
  .approval .buttons { display: flex; gap: .6rem; }
  .approval button { border: none; border-radius: 6px; padding: .35rem 1rem;
                     font-size: .82rem; cursor: pointer; }
  .approval button.yes { background: var(--rust); color: #fff; }
  .approval button.no { background: var(--line); color: var(--ink); }
  .approval.decided { border-color: var(--line); opacity: .6; }
  .approval.decided .buttons { display: none; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: .8rem 1rem; }
  .composer { width: 100%; display: flex; gap: .6rem; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: var(--bg); color: var(--ink);
             border: 1px solid var(--line); border-radius: 8px; padding: .6rem .8rem;
             font: inherit; min-height: 2.6rem; max-height: 10rem; }
  textarea:focus { outline: none; border-color: var(--steel); }
  .composer button { background: var(--rust); color: #fff; border: none; border-radius: 8px;
                     padding: .6rem 1.1rem; font-size: .9rem; cursor: pointer; }
  .composer button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#0f1114"/><g stroke="#c2643a" stroke-width="12" stroke-linecap="square" fill="none"><polyline points="46,24 83,43 46,62"/><polyline points="82,104 45,85 82,66"/></g></svg>
  <span class="name">jern</span>
  <span class="chip" id="model">…</span>
  <span class="meta" id="session"></span>
  <span class="spacer"></span>
  <span class="meta" id="cost"></span>
  <button id="interrupt" title="Interrupt the current turn">stop</button>
  <button id="undo" title="Revert the last jern commit">undo</button>
</header>
<main><div class="feed" id="feed"></div></main>
<footer>
  <div class="composer">
    <textarea id="input" placeholder="Describe the task… (Enter to send, Shift-Enter for a newline)"></textarea>
    <button id="send">send</button>
  </div>
</footer>
<script>
const feed = document.getElementById("feed");
const input = document.getElementById("input");
const send = document.getElementById("send");
let streamingBlock = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  feed.appendChild(node);
  node.scrollIntoView({ block: "end" });
  return node;
}

function assistantBlock() {
  if (!streamingBlock) streamingBlock = el("div", "msg assistant streaming", "");
  return streamingBlock;
}

function endTurn() {
  if (streamingBlock) streamingBlock.classList.remove("streaming");
  streamingBlock = null;
  send.disabled = false;
}

function toolChip(call) {
  const input = call.input || {};
  const detail = input.path || input.command || "";
  const chip = el("div", "tool");
  chip.append("→ ");
  const name = document.createElement("b");
  name.textContent = call.name;
  chip.appendChild(name);
  if (detail) chip.append(" " + (detail.length > 80 ? detail.slice(0, 77) + "…" : detail));
}

function approvalCard(id, description) {
  const card = el("div", "approval");
  const h = document.createElement("h4"); h.textContent = "approval required"; card.appendChild(h);
  const pre = document.createElement("pre");
  description.split("\n").forEach(line => {
    const span = document.createElement("span");
    if (line.startsWith("  - ")) span.className = "minus";
    if (line.startsWith("  + ")) span.className = "plus";
    span.textContent = line + "\n";
    pre.appendChild(span);
  });
  card.appendChild(pre);
  const buttons = document.createElement("div"); buttons.className = "buttons";
  const answer = approved => {
    fetch("/approve", { method: "POST", body: JSON.stringify({ id, approved }) });
    card.classList.add("decided");
    h.textContent = approved ? "approved" : "denied";
  };
  const yes = document.createElement("button"); yes.className = "yes"; yes.textContent = "approve";
  const no = document.createElement("button"); no.className = "no"; no.textContent = "deny";
  yes.onclick = () => answer(true);
  no.onclick = () => answer(false);
  buttons.append(yes, no);
  card.appendChild(buttons);
  card.scrollIntoView({ block: "end" });
}

function onState(s) {
  document.getElementById("model").textContent = s.model;
  document.getElementById("session").textContent = "session " + s.session + " · v" + s.version;
  const tokens = (s.input_tokens || 0) + (s.output_tokens || 0);
  document.getElementById("cost").textContent = tokens ? tokens.toLocaleString() + " tokens" : "";
}

const events = new EventSource("/events");
events.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === "text") assistantBlock().insertAdjacentText("beforeend", m.text),
                          feed.lastElementChild.scrollIntoView({ block: "end" });
  else if (m.type === "state") onState(m);
  else if (m.type === "approval") approvalCard(m.id, m.description);
  else if (m.type === "done") endTurn();
  else if (m.type === "error") { el("div", "error", m.message); endTurn(); }
  else if (m.type === "trace" && m.event) {
    if (m.event.event === "tool-call" && m.event.call) { endStreamSegment(); toolChip(m.event.call); }
    if (m.event.event === "git-commit") el("div", "note", "committed " + m.event.path);
  }
};

// A tool call visually closes the current text block; new text opens another.
function endStreamSegment() {
  if (streamingBlock) streamingBlock.classList.remove("streaming");
  streamingBlock = null;
}

function submit() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  el("div", "msg user", text);
  input.value = "";
  send.disabled = true;
  fetch("/message", { method: "POST", body: JSON.stringify({ text }) })
    .then(r => { if (!r.ok) return r.json().then(b => { el("div", "error", b.error); endTurn(); }); });
}

send.onclick = submit;
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
document.getElementById("interrupt").onclick = () => fetch("/interrupt", { method: "POST", body: "{}" });
document.getElementById("undo").onclick = () =>
  fetch("/undo", { method: "POST", body: "{}" }).then(r => r.json())
    .then(b => el("div", "note", b.subject ? "undone: " + b.subject : b.message));
</script>
</body>
</html>
