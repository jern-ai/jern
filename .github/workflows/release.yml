name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Verify version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match root version file
        id: check
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::version file is '$FILE_VERSION' but tag is 'v$TAG_VERSION'."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing jern $FILE_VERSION"

  test:
    name: Test (linux)
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          path: jern
      - uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          ref: 62af4262d62ac4fcc91b3bfdb69527c3c2674613 # pinned; bump deliberately
          path: IronKernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"
      - run: dotnet test jern/Jern.slnx -c Release --verbosity normal

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: jern
            smoke: true
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            rid: linux-arm64
            exe: jern
            smoke: true
          - os: macos-latest
            rid: osx-arm64
            exe: jern
            smoke: true
          # osx-x64 is cross-compiled on arm64 runners; the binary can't be
          # executed there without relying on Rosetta, so no smoke run.
          - os: blacksmith-6vcpu-macos-latest
            rid: osx-x64
            exe: jern
            smoke: false
          - os: windows-latest
            rid: win-x64
            exe: jern.exe
            smoke: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: jern
      - uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          ref: 62af4262d62ac4fcc91b3bfdb69527c3c2674613 # pinned; bump deliberately
          path: IronKernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"

      # Cross-compiling (osx-x64 on Blacksmith's arm64 Macs) needs no special
      # handling: the IronKernel Exe reference is built RID-agnostic (its
      # fsproj declares IsRidAgnostic etc. upstream; Jern.Host.fsproj adds
      # UndefineProperties on the reference).
      - name: Restore
        run: dotnet restore jern/src/Jern.Cli/Jern.Cli.fsproj -r ${{ matrix.rid }}

      # -m:1: the SDK's transitive publish walk issues several Build requests
      # for the same project with different (leaked) global-property sets, all
      # writing one obj path. In parallel that races — Windows locks the file
      # (CS2012). The graph is a linear F# chain, so serializing costs nothing.
      - name: Publish self-contained binary
        run: >
          dotnet publish jern/src/Jern.Cli/Jern.Cli.fsproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -m:1
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/jern-${{ matrix.rid }}"
          mkdir -p "$STAGE"
          # Binary plus its Kernel source: stdlib, the host's kernel/ files,
          # and both bundled agents. All of it is the product.
          cp -R publish/${{ matrix.rid }}/. "$STAGE/"
          cp jern/README.md jern/LICENSE "$STAGE/"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$STAGE/${{ matrix.exe }}"
          fi
          tar -C dist -czf "dist/jern-${{ matrix.rid }}.tar.gz" "jern-${{ matrix.rid }}"

      # The staged tarball is exactly what users install — run it before
      # shipping it, so a packaging slip (missing agents, kernel files, ui)
      # fails the release instead of the first user.
      - name: Smoke-test the staged tarball
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          tar -xzf "dist/jern-${{ matrix.rid }}.tar.gz" -C "$SMOKE"
          BIN="$SMOKE/jern-${{ matrix.rid }}/${{ matrix.exe }}"
          VERSION="$("$BIN" --version)"
          if [[ "$VERSION" != "${{ needs.version.outputs.version }}" ]]; then
            echo "::error::--version printed '$VERSION', expected '${{ needs.version.outputs.version }}'"
            exit 1
          fi
          # The bundled default agent's replay suite is network-free. Its
          # setup uses POSIX shell commands, so it stays off Windows.
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            (cd "$SMOKE" && "$BIN" test)
          fi
          # eject must work offline from the bundle, on every platform.
          (cd "$SMOKE" && "$BIN" eject)
          test -f "$SMOKE/agents/default/src/main.ikr"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jern-${{ matrix.rid }}
          path: dist/jern-${{ matrix.rid }}.tar.gz

  agents:
    name: Pack agent packages
    needs: [version, test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          path: jern
      - uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          ref: 62af4262d62ac4fcc91b3bfdb69527c3c2674613 # pinned; bump deliberately
          path: IronKernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"
      - name: ik pack the bundled agents
        run: |
          set -euo pipefail
          cd jern/agents/default && dotnet run --project ../../../IronKernel/IronKernel -- pack default.ikproj
          cd ../docs && dotnet run --project ../../../IronKernel/IronKernel -- pack docs.ikproj
          cd ../tdd && dotnet run --project ../../../IronKernel/IronKernel -- pack tdd.ikproj
      - uses: actions/upload-artifact@v4
        with:
          name: jern-agent-packages
          path: jern/agents/*/bin/*.nupkg

  release:
    name: Create GitHub Release
    needs: [version, publish, agents]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.nupkg' \) -exec cp {} release-assets/ \;
          ls -la release-assets
      # Checksums for the curl|sh install path: install.sh in jern-ai/website verifies
      # the tarball it downloads against this file.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat release-assets/SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: jern ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
