name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Verify version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match root version file
        id: check
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::version file is '$FILE_VERSION' but tag is 'v$TAG_VERSION'."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing jern $FILE_VERSION"

  test:
    name: Test (linux)
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          path: jern
      - uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          path: IronKernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test jern/Jern.slnx -c Release --verbosity normal

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: jern
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            rid: linux-arm64
            exe: jern
          - os: macos-latest
            rid: osx-arm64
            exe: jern
          - os: blacksmith-6vcpu-macos-latest
            rid: osx-x64
            exe: jern
          - os: windows-latest
            rid: win-x64
            exe: jern.exe
    steps:
      - uses: actions/checkout@v4
        with:
          path: jern
      - uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          path: IronKernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Cross-compiling (osx-x64 on Blacksmith's arm64 Macs) needs no special
      # handling: the IronKernel Exe reference is built RID-agnostic (see
      # Jern.Host.fsproj UndefineProperties + ErrorOnDuplicatePublishOutputFiles
      # in Jern.Cli.fsproj).
      - name: Restore
        run: dotnet restore jern/src/Jern.Cli/Jern.Cli.fsproj -r ${{ matrix.rid }}

      - name: Publish self-contained binary
        run: >
          dotnet publish jern/src/Jern.Cli/Jern.Cli.fsproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/jern-${{ matrix.rid }}"
          mkdir -p "$STAGE"
          # Binary plus its Kernel source: stdlib, the host's kernel/ files,
          # and both bundled agents. All of it is the product.
          cp -R publish/${{ matrix.rid }}/. "$STAGE/"
          cp jern/README.md jern/LICENSE "$STAGE/"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$STAGE/${{ matrix.exe }}"
          fi
          tar -C dist -czf "dist/jern-${{ matrix.rid }}.tar.gz" "jern-${{ matrix.rid }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jern-${{ matrix.rid }}
          path: dist/jern-${{ matrix.rid }}.tar.gz

  agents:
    name: Pack agent packages
    needs: [version, test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          path: jern
      - uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          path: IronKernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: ik pack both bundled agents
        run: |
          set -euo pipefail
          cd jern/agents/default && dotnet run --project ../../../IronKernel/IronKernel -- pack default.ikproj
          cd ../docs && dotnet run --project ../../../IronKernel/IronKernel -- pack docs.ikproj
      - uses: actions/upload-artifact@v4
        with:
          name: jern-agent-packages
          path: jern/agents/*/bin/*.nupkg

  release:
    name: Create GitHub Release
    needs: [version, publish, agents]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.nupkg' \) -exec cp {} release-assets/ \;
          ls -la release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: jern ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
