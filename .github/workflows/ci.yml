name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout jern-agent
        uses: actions/checkout@v4
        with:
          path: jern

      # So the bubblewrap shell-confinement path (and its test) actually
      # exercises on CI instead of degrading to approval-only.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"

      # jern-symbols, the tree-sitter helper the symbol tools call. Built from
      # pinned sources before the .NET build copies it beside the binary; the
      # tests then require it, so a helper that fails to build fails CI.
      # The vendored sources, keyed on the pins, so a release does not lean
      # on eight clones from GitHub succeeding at once.
      - name: Cache the tree-sitter sources
        uses: actions/cache@v4
        with:
          path: jern/native/symbols/vendor
          key: symbols-vendor-${{ hashFiles('jern/native/symbols/sources.txt') }}

      - name: Build the tree-sitter helper
        run: bash jern/native/symbols/fetch.sh && bash jern/native/symbols/build.sh

      - name: Restore
        run: dotnet restore jern/Jern.slnx

      - name: Build
        run: dotnet build jern/Jern.slnx -c Release --no-restore

      - name: Test
        run: dotnet test jern/Jern.slnx -c Release --no-build --verbosity normal
        env:
          JERN_SYMBOLS_REQUIRED: "1"

      - name: Test live Action contract
        run: bash jern/action/test-live-run.sh
