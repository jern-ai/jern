name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout jern-agent
        uses: actions/checkout@v4
        with:
          path: jern

      # IronKernel is consumed as source from a sibling checkout until
      # IronKernel.Runtime (+ parser/compiler libraries) ship on NuGet.
      # Pinned to a known-good commit so builds are reproducible and an
      # upstream push cannot break CI (or a release) mid-tag; bump the ref
      # deliberately when picking up upstream changes.
      - name: Checkout IronKernel
        uses: actions/checkout@v4
        with:
          repository: ironkernel-lang/IronKernel
          ref: 62af4262d62ac4fcc91b3bfdb69527c3c2674613
          path: IronKernel

      # So the bubblewrap shell-confinement path (and its test) actually
      # exercises on CI instead of degrading to approval-only.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.4xx"

      - name: Restore
        run: dotnet restore jern/Jern.slnx

      - name: Build
        run: dotnet build jern/Jern.slnx -c Release --no-restore

      - name: Test
        run: dotnet test jern/Jern.slnx -c Release --no-build --verbosity normal
